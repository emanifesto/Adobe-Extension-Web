<!DOCTYPE>
<html>
    <head>
        <title>Dami SaaS</title>
        <link href="asma.css" rel="stylesheet">
        <style>
            body{
                background-color: #404040;
                color: aliceblue;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
            }
            nav{
                display: flex;
                background-color: #282727;
                margin: 0;
                height: 40px;
                padding: 10px 35px;
            }
            a{
                display: inline-block;
                text-decoration-line: none;
                color: aliceblue;
                width: fit-content;
                height: fit-content;
            }
            .nav-elem{
                margin: 10px;
                vertical-align: middle;
            }
            .quote{
                text-align: center;
            }
            h1{
                margin: 0;
                padding: 0 5px;
            }
            em{
                font-family:'Times New Roman', Times, serif;
            }
            img{
                width: auto;
                height: auto;
            }
        </style>
    </head>
    <body>
        <nav>
            <a class="nav-elem" href="https://damisaas.com">
                <img src="https://damisaas.com/images/damisaas-nobg.png" alt="Dami SaaS icon">
                <h1>Dami SaaS</h1>
            </a>
        </nav>
        <main>
            <h1 class="quote"><em>" Software solutions helping entreprenuers around the world "</em></h1>
        </main>
    </body>
</html>
